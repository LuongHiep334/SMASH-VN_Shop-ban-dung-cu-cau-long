spring.application.name=SMASH-VN
server.port=8080

# Inventory Lot Configuration (Rollout Timestamp)
inventory.lot.enabled-from=2026-08-07T08:30:00


spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BadmintonShopDB1;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Config (ddl-auto=validate enforced everywhere)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Multipart Upload Limits & Tomcat Post Size
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB

# Mail SMTP Configuration (No default for password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Google OAuth2 Configuration (No default for client-secret)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Session Configuration
server.servlet.session.timeout=30m

# Proxy Forwarded Headers Strategy (Crucial for Ngrok, Nginx, Cloudflare)
server.forward-headers-strategy=framework

# Flyway Migration Config
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Caffeine Cache Config
spring.cache.type=caffeine
spring.cache.cache-names=thongke,ipLocationCache,geocodeSearchCache,reverseGeocodeCache,taiKhoanStatus,shipping-carriers,moderationKeywords,moderationRawKeywords,globalCategories,globalBrands
spring.cache.caffeine.spec=expireAfterWrite=30s

# Response compression and conservative browser caching for production traffic.
# Both defaults can be overridden without changing source code.
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
spring.web.resources.cache.period=${STATIC_CACHE_PERIOD:1d}
spring.web.resources.chain.cache=true

# Geolocation Testing Config
location.test.ip=1.53.0.0

# Security Auditing & Upload Path (Hardened)
app.admin.emails=${APP_ADMIN_EMAILS}
app.upload.path=${APP_UPLOAD_PATH}
app.base-url=${APP_BASE_URL:}

# Session Cookie Security Flags (HttpOnly, Secure, SameSite)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# SePay Payment Gateway Configuration
sepay.api-key=${SEPAY_API_KEY:}
sepay.secret-key=${SEPAY_SECRET_KEY:}
sepay.ipn-secret=${SEPAY_IPN_SECRET:}
sepay.base-url=${SEPAY_BASE_URL:https://api.sepay.vn}
sepay.bank-account=${SEPAY_BANK_ACCOUNT:1234567890}
sepay.bank-name=${SEPAY_BANK_NAME:Vietcombank}
sepay.memo-prefix=${SEPAY_MEMO_PREFIX:}
sepay.debug=${SEPAY_DEBUG:false}
sepay.ip-verification=${SEPAY_IP_VERIFICATION:false}
sepay.ip-ranges=${SEPAY_IP_RANGES:172.236.138.20,172.233.83.68,171.244.35.2,151.158.108.68,151.158.109.79,103.255.238.139}

# Shipping Fee Fallback Settings
shipping.ghtk.local=22000
shipping.ghtk.nationwide=30000
shipping.ghn.local=25000
shipping.ghn.nationwide=38000
shipping.default.local=30000

# GHN (Giao Hang Nhanh) API Configuration
ghn.token=${GHN_TOKEN:your-ghn-token-here}
ghn.shop-id=${GHN_SHOP_ID:0}
ghn.base-url=${GHN_BASE_URL:https://dev-online-gateway.ghn.vn}
ghn.from-district-id=${GHN_FROM_DISTRICT_ID:1454}
ghn.from-ward-code=${GHN_FROM_WARD_CODE:21012}
ghn.from-address=${GHN_FROM_ADDRESS:10 Kim Mã, Ba Đình, Hà  Nội}
ghn.webhook-token=${GHN_WEBHOOK_TOKEN:}

# Shared shop contact address. Keep the warehouse address in GHN_FROM_ADDRESS as the single source of truth.
shop.contact.address=${ghn.from-address}

# Legacy forward-geocoding search used by LocationService.searchAddress()
location.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
location.nominatim.user-agent=${NOMINATIM_USER_AGENT:SMASH-VN/1.0}

# Backend-only reverse geocoding; never expose MAPTILER_API_KEY to Thymeleaf/JavaScript
location.maptiler.base-url=${MAPTILER_BASE_URL:https://api.maptiler.com}
location.maptiler.api-key=${MAPTILER_API_KEY:}
location.maptiler.user-agent=${MAPTILER_USER_AGENT:SMASH-VN/1.0}

# GHN Scheduler Polling - Co che du phong dong bo trang thai don hang
ghn.polling.enabled=${GHN_POLLING_ENABLED:true}
ghn.polling.interval-ms=${GHN_POLLING_INTERVAL_MS:600000}
ghn.polling.batch-size=${GHN_POLLING_BATCH_SIZE:50}

# Shipping Zone Configurations
shipping.local-province-ids=201,244
shipping.local-provinces=ha noi,thai nguyen

# Disable partial output in Thymeleaf to prevent session creation errors when rendering templates
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# Cache compiled Thymeleaf templates by default. Set SPRING_THYMELEAF_CACHE=false while editing views locally.
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:true}

# Chatbot Gemini API Key Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/openai
gemini.api.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.api.connect-timeout=5s
gemini.api.read-timeout=30s
gemini.chat.max-history-messages=5
gemini.chat.max-user-message-length=2000
gemini.chat.max-product-suggestions=3
