<!DOCTYPE html>
<html class="no-js" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!--[if IE]><meta http-equiv="X-UA-Compatible" content="IE=edge"><![endif]-->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link th:href="@{/images/favicon.png}" rel="shortcut icon">
    <title>Smash VN - Đặt lại mật khẩu</title>

    <!--====== Phông chữ Google ======-->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,800" rel="stylesheet">

    <!--====== CSS Nhà cung cấp ======-->
    <link rel="stylesheet" th:href="@{/css/vendor.css}">

    <!--====== Tiện ích khoảng cách ======-->
    <link rel="stylesheet" th:href="@{/css/utility.css}">

    <!--====== Ứng dụng ======-->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="config">
    <div class="preloader is-active">
        <div class="preloader__wrap">

            <img class="preloader__img" th:src="@{/images/preloader.svg}" alt="Đang tải" width="64" height="64">
        </div>
    </div>

    <div id="app">

        <!--====== Tiêu đề chính ======-->
        <header class="header--style-1">
            <div th:replace="~{layout/header :: header}"></div>
        </header>
        <!--====== End - Main Header ======-->


        <!--====== App Content ======-->
        <div class="app-content">

            <!--====== Section 1 ======-->
            <div class="u-s-p-y-60">

                <!--====== Section Content ======-->
                <div class="section__content">
                    <div class="container">
                        <div class="breadcrumb">
                            <div class="breadcrumb__wrap">
                                <ul class="breadcrumb__list">
                                    <li class="has-separator">

                                        <a th:href="@{/}">Trang chủ</a></li>
                                    <li class="is-marked">

                                        <a th:href="@{/user/quen-mat-khau}">Đặt lại mật khẩu</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--====== End - Section 1 ======-->


            <!--====== Section 2 ======-->
            <div class="u-s-p-b-60">

                <!--====== Section Intro ======-->
                <div class="section__intro u-s-m-b-60">
                    <div class="container">
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="section__text-wrap">
                                    <h1 class="section__heading u-c-secondary">QUÊN MẬT KHẨU?</h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--====== End - Section Intro ======-->


                <!--====== Section Content ======-->
                <div class="section__content">
                    <div class="container">
                        <div class="row row--center">
                            <div class="col-lg-6 col-md-8 u-s-m-b-30">
                                <div class="l-f-o">
                                    <div class="l-f-o__pad-box">
                                        <h1 class="gl-h1">ĐẶT LẠI MẬT KHẨU</h1>
                                        
                                        <div th:if="${thongBao != null}" class="alert alert-success" style="color: green; font-weight: bold; margin-bottom: 20px;">
										    <i class="fas fa-check-circle"></i> <span th:text="${thongBao}"></span>
										</div>
										
										<div th:if="${loi != null}" class="alert alert-danger" style="color: red; font-weight: bold; margin-bottom: 20px;">
										    <i class="fas fa-exclamation-triangle"></i> <span th:text="${loi}"></span>
										</div>
										
										<form class="l-f-o__form" th:action="@{/user/dat-lai-mat-khau}" method="post">
										    <input type="hidden" name="token" th:value="${token}">
										    
										    <div class="u-s-m-b-30">
										        <label class="gl-label" for="reset-pass">MẬT KHẨU MỚI *</label>
										        <div style="position:relative;display:flex;align-items:center;">
										            <input class="input-text input-text--primary-style" type="password" id="reset-pass" name="matKhauMoi" required placeholder="Nhập mật khẩu mới" maxlength="30" style="border: 2px solid #ccc;padding-right:40px;width:100%;">
										            <button type="button" id="toggleResetPass"
										                    title="Giữ chuột để xem mật khẩu"
										                    style="position:absolute;right:8px;background:none;border:none;cursor:pointer;color:#888;font-size:16px;padding:4px;line-height:1;"
										                    aria-label="Xem mật khẩu">
										                <i class="fas fa-eye" id="iconResetPass"></i>
										            </button>
										        </div>
										    </div>
										    
										    <div class="u-s-m-b-30">
										        <label class="gl-label" for="reset-pass-confirm">XÁC NHẬN MẬT KHẨU *</label>
										        <div style="position:relative;display:flex;align-items:center;">
										            <input class="input-text input-text--primary-style" type="password" id="reset-pass-confirm" name="xacNhanMatKhau" required placeholder="Nhập lại mật khẩu mới" maxlength="30" style="border: 2px solid #ccc;padding-right:40px;width:100%;">
										            <button type="button" id="toggleResetPassConfirm"
										                    title="Giữ chuột để xem mật khẩu"
										                    style="position:absolute;right:8px;background:none;border:none;cursor:pointer;color:#888;font-size:16px;padding:4px;line-height:1;"
										                    aria-label="Xem mật khẩu">
										                <i class="fas fa-eye" id="iconResetPassConfirm"></i>
										            </button>
										        </div>
										    </div>
										    
										    <div class="gl-inline">
										        <div class="u-s-m-b-30">
										            <button class="btn btn--e-transparent-brand-b-2" type="submit">ĐỔI MẬT KHẨU</button>
										        </div>
										    </div>
										</form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--====== End - Section Content ======-->
            </div>
            <!--====== End - Section 2 ======-->
        </div>
        <!--====== End - App Content ======-->


        <!--====== Main Footer ======-->
        <footer th:replace="~{layout/footer :: footer}"></footer>
        <div th:replace="~{layout/modals :: all-modals}"></div>
    </div>
    <!--====== End - Main App ======-->


    <!--====== Google Analytics: change UA-XXXXX-Y to be your site's ID ======-->
    <script>
        window.ga = function() {
            ga.q.push(arguments)
        };
        ga.q = [];
        ga.l = +new Date;
        ga('create', 'UA-XXXXX-Y', 'auto');
        ga('send', 'pageview')
    </script>
    <script src="https://www.google-analytics.com/analytics.js" async defer></script>

    <!--====== Vendor Js ======-->
    <script th:src="@{/js/vendor.js}"></script>

    <!--====== Plugin jQuery Shopnav ======-->
    <script th:src="@{/js/jquery.shopnav.js}"></script>

    <!--====== Ứng dụng ======-->
    <script th:src="@{/js/app.js}"></script>

    <!--====== Khi không hỗ trợ JavaScript ======-->
    <noscript>
        <div class="app-setting">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="app-setting__wrap">
                            <h1 class="app-setting__h1">JavaScript đã bị tắt trên trình duyệt của bạn.</h1>

                            <span class="app-setting__text">Vui lòng bật JavaScript trên trình duyệt để sử dụng đầy đủ chức năng của website.</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </noscript>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.querySelector(".l-f-o__form");
            if (!form) return;
            const passwordInput = document.getElementById("reset-pass");
            const confirmInput = document.getElementById("reset-pass-confirm");
            const submitBtn = form.querySelector("button[type='submit']");

            function createErrorElement(inputEl, id) {
                let errEl = document.getElementById(id);
                if (!errEl) {
                    errEl = document.createElement("span");
                    errEl.id = id;
                    errEl.style.color = "#ff0000";
                    errEl.style.fontSize = "13px";
                    errEl.style.display = "none";
                    errEl.style.marginTop = "5px";
                    errEl.style.fontWeight = "bold";
                    if (inputEl.type === "password") {
                        inputEl.parentNode.parentNode.appendChild(errEl);
                    } else {
                        inputEl.parentNode.appendChild(errEl);
                    }
                }
                return errEl;
            }

            const passwordError = createErrorElement(passwordInput, "password-error");
            const confirmError = createErrorElement(confirmInput, "confirm-error");

            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)\S{8,30}$/;

            function validatePassword() {
                let value = passwordInput.value;
                if (/\s/.test(value)) {
                    passwordError.textContent = "Mật khẩu không được chứa khoảng trắng!";
                    passwordError.style.display = "block";
                    return false;
                }
                if (!value) {
                    passwordError.textContent = "Mật khẩu không được để trống!";
                    passwordError.style.display = "block";
                    return false;
                }
                if (value.length < 8 || value.length > 30) {
                    passwordError.textContent = "Mật khẩu phải dài từ 8 đến 30 ký tự!";
                    passwordError.style.display = "block";
                    return false;
                }
                if (!passwordRegex.test(value)) {
                    passwordError.textContent = "Mật khẩu phải chứa cả chữ và số!";
                    passwordError.style.display = "block";
                    return false;
                }
                passwordError.style.display = "none";
                return true;
            }

            function validateConfirmPassword() {
                const passVal = passwordInput.value;
                const confirmVal = confirmInput.value;
                if (!confirmVal) {
                    confirmError.textContent = "Vui lòng nhập lại mật khẩu!";
                    confirmError.style.display = "block";
                    return false;
                }
                if (passVal !== confirmVal) {
                    confirmError.textContent = "Mật khẩu xác nhận không trùng khớp!";
                    confirmError.style.display = "block";
                    return false;
                }
                confirmError.style.display = "none";
                return true;
            }

            passwordInput.addEventListener("input", function() {
                validatePassword();
                if (confirmInput.value) {
                    validateConfirmPassword();
                }
            });
            confirmInput.addEventListener("input", validateConfirmPassword);

            form.addEventListener("submit", function (e) {
                const isPasswordValid = validatePassword();
                const isConfirmValid = validateConfirmPassword();

                if (!isPasswordValid || !isConfirmValid) {
                    e.preventDefault();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đổi mật khẩu...';
            });
        });
    </script>
    <script>
        // Password eye — hold to show, release to hide
        (function() {
            function bindToggle(btnId, inpId, iconId) {
                const btn  = document.getElementById(btnId);
                const inp  = document.getElementById(inpId);
                const icon = document.getElementById(iconId);
                if (!btn) return;
                function show(e) { if (e.type==='mousedown') e.preventDefault(); inp.type='text';     icon.className='fas fa-eye-slash'; }
                function hide()  { inp.type='password'; icon.className='fas fa-eye'; }
                btn.addEventListener('mousedown',  show);
                btn.addEventListener('mouseup',    hide);
                btn.addEventListener('mouseleave', hide);
                btn.addEventListener('touchstart', show);
                btn.addEventListener('touchend',   hide);
            }
            bindToggle('toggleResetPass',        'reset-pass',         'iconResetPass');
            bindToggle('toggleResetPassConfirm', 'reset-pass-confirm', 'iconResetPassConfirm');
        })();
    </script>
</body>
</html>
