<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Hủy nhận tin thành công - Smash VN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f1013;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            background: linear-gradient(145deg, #15171c 0%, #1a1d24 100%);
            border: 1px solid rgba(255, 69, 0, 0.15);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 4rem;
            color: #ff4500;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 69, 0, 0.4);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 0 0 15px 0;
            color: #ffffff;
        }
        p {
            font-size: 0.95rem;
            color: #a0a5b0;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff4500 0%, #e03d00 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 69, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>Hủy nhận tin thành công</h1>
        <p>Email của bạn đã được gỡ bỏ khỏi danh sách nhận tin khuyến mãi tự động của Smash VN. Bạn sẽ không nhận thêm bất kỳ email quảng cáo nào từ chúng tôi.</p>
        <a href="/" class="btn">Quay lại trang chủ</a>
    </div>
</body>
</html>
