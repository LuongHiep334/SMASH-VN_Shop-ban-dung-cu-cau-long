<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Bài Viết - Admin SmashVN</title>
    
    <!-- Bootstrap 5.3.0 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Admin Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/admin-custom.css(v='2.4')}">
    <script th:src="@{/js/admin-layout-state.js(v='1.0')}"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Load local CKEditor -->
    <script th:src="@{/vendor/ckeditor/ckeditor.js}"></script>
    <script th:src="@{/vendor/ckeditor/translations/vi.js}"></script>
    
    <style>
        .ck-editor__editable_inline { min-height: 220px; max-height: 380px; }
        .ck-powered-by, .ck.ck-powered-by, [class*="ck-powered-by"] { display: none !important; visibility: hidden !important; height: 0 !important; }
        body.iframe-mode, html.iframe-mode {
            background-color: #ffffff !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow-x: hidden !important;
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100% !important;
        }
        body.iframe-mode .admin-page {
            margin-left: 0 !important;
            padding: 0 !important;
            min-height: auto !important;
        }
        body.iframe-mode .admin-content {
            margin-left: 0 !important;
            padding: 15px 20px 30px 20px !important;
            min-height: auto !important;
            background-color: #ffffff !important;
        }
        body.iframe-mode .admin-container {
            padding-left: 0 !important;
            padding-right: 0 !important;
            max-width: 100% !important;
        }
        body.iframe-mode .card, body.iframe-mode .admin-card {
            box-shadow: none !important;
            border: none !important;
            margin-bottom: 0 !important;
            background: transparent !important;
        }
        body.iframe-mode .admin-card-body {
            padding: 0 !important;
        }
        body.iframe-mode .form-actions-bar {
            position: relative !important;
            bottom: auto !important;
            background: transparent !important;
            padding: 20px 0 10px 0 !important;
            border-top: 1px solid #e2e8f0 !important;
            box-shadow: none !important;
            z-index: auto !important;
            margin: 0 !important;
        }
    </style>
    <script>
        if (window.self !== window.top) {
            document.documentElement.classList.add('iframe-mode');
            const style = document.createElement('style');
            style.innerHTML = `
                .sidebar, nav.sidebar, .admin-header, .admin-topbar, .admin-page-header { display: none !important; }
                body, body.iframe-mode, html, html.iframe-mode { background-color: #ffffff !important; padding: 0 !important; margin: 0 !important; overflow-x: hidden !important; overflow-y: auto !important; }
                .admin-page { margin-left: 0 !important; padding-left: 0 !important; min-height: auto !important; }
                main.main-content, .main-content, .admin-content { margin-left: 0 !important; padding: 15px 20px 30px 20px !important; width: 100% !important; max-width: 100% !important; flex: 0 0 100% !important; min-height: auto !important; background-color: #ffffff !important; }
                .admin-container { padding-left: 0 !important; padding-right: 0 !important; max-width: 100% !important; }
                .card, .admin-card { box-shadow: none !important; border: none !important; margin-bottom: 0 !important; background: transparent !important; }
                .btn-back-normal { display: none !important; }
                .btn-close-iframe { display: inline-block !important; }
            `;
            document.head.appendChild(style);
            document.addEventListener('DOMContentLoaded', function() {
                document.body.classList.add('iframe-mode');
                window.scrollTo(0, 0);
                const form = document.querySelector('form');
                if (form && form.action && !form.action.includes('iframe=')) {
                    form.action += (form.action.includes('?') ? '&' : '?') + 'iframe=true';
                }
            });
        }
    </script>
</head>
<body class="admin-body" th:classappend="${isIframe} ? 'iframe-mode' : ''">

    <!-- Sidebar Layout Fragment -->
    <th:block th:unless="${isIframe}">
        <div th:replace="~{admin/layout/sidebar :: sidebar('blog')}"></div>
    </th:block>

    <div class="admin-page">
        <!-- Topbar Layout Fragment -->
        <th:block th:unless="${isIframe}">
            <div th:replace="~{admin/layout/header :: header}"></div>
        </th:block>

        <!-- Main Content -->
        <main class="admin-content" th:classappend="${isIframe} ? 'p-0' : ''">
            <div class="container-fluid admin-container">

                <!-- Page Header -->
                <div class="admin-page-header" th:unless="${isIframe}">
                    <div>
                        <h1 class="admin-page-title"><i class="fas fa-edit text-brand me-2"></i>Chỉnh Sửa Bài Viết</h1>
                    </div>
                    <div class="admin-toolbar d-flex align-items-center gap-2">
                        <a href="javascript:void(0)" 
                           th:data-url="@{/admin/blog/preview/{id}(id=${blog.id})}" 
                           th:data-title="${blog.title}" 
                           onclick="openBlogPreviewModal(this.getAttribute('data-url'), this.getAttribute('data-title'))" 
                           class="admin-btn admin-btn-info btn-preview-edit" 
                           title="Xem trước bài viết (không cần mở tab mới)">
                            <i class="fas fa-eye me-1"></i> Xem trước
                        </a>
                        <a th:href="@{/admin/blog}" class="admin-btn admin-btn-secondary btn-back-normal">
                            <i class="fas fa-arrow-left me-1"></i> Quay lại
                        </a>
                        <button type="button" class="admin-btn admin-btn-secondary btn-close-iframe" style="display: none;" onclick="window.parent.closeBlogFormModal()">
                            <i class="fas fa-times me-1"></i> Đóng
                        </button>
                    </div>
                </div>

                <!-- Alert Messages -->
                <div th:if="${loi != null}" class="alert alert-danger alert-dismissible fade show border-start border-danger border-4 rounded-3 shadow-sm mb-4" role="alert">
                    <i class="fas fa-times-circle me-2"></i><span th:text="${loi}">Lỗi xử lý</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Edit Form Card -->
                <div class="admin-card mb-5">
                    <div class="admin-card-header">
                        <h5 class="admin-card-title"><i class="fas fa-pencil-alt text-primary me-2"></i>Cập Nhật Thông Tin Bài Viết</h5>
                    </div>
                    <div class="admin-card-body p-4">
                        <form th:object="${blog}" th:action="${isIframe} ? @{/admin/blog/edit/{id}(id=${blog.id}, iframe=true)} : @{/admin/blog/edit/{id}(id=${blog.id})}" method="POST" enctype="multipart/form-data" id="editBlogForm" onsubmit="return confirmSubmitForm(this, 'Bạn có chắc chắn muốn lưu thông tin cập nhật cho bài viết này không?');">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="hidden" th:field="*{id}" />
                            <input type="hidden" th:field="*{image}" />
                            <input type="hidden" th:field="*{slug}" />
                            <input type="hidden" th:field="*{status}" />

                            <div class="row g-4">
                                <!-- Title -->
                                <div class="col-md-8">
                                    <label for="title" class="admin-form-label">Tiêu đề bài viết <span class="text-danger">*</span></label>
                                    <input type="text" class="admin-form-control form-control" id="title" th:field="*{title}" placeholder="Nhập tiêu đề hấp dẫn..." required oninvalid="this.setCustomValidity('Vui lòng nhập tiêu đề bài viết!')" oninput="this.setCustomValidity('')">
                                </div>
                                
                                <!-- Category -->
                                <div class="col-md-4">
                                    <label for="category" class="admin-form-label">Danh mục bài viết <span class="text-danger">*</span></label>
                                    <select class="form-select admin-form-control" id="category" th:field="*{category}" required oninvalid="this.setCustomValidity('Vui lòng chọn danh mục bài viết!')" oninput="this.setCustomValidity('')">
                                        <option value="">-- Chọn danh mục --</option>
                                        <option value="Hướng Dẫn">Hướng Dẫn</option>
                                        <option value="Review">Review Sản Phẩm</option>
                                        <option value="Kỹ Thuật">Kỹ Thuật Cầu Lông</option>
                                        <option value="Tin Tức">Tin Tức</option>
                                    </select>
                                </div>

                                <!-- Author -->
                                <div class="col-md-6">
                                    <label for="author" class="admin-form-label">Tác giả <span class="text-danger">*</span></label>
                                    <input type="text" class="admin-form-control form-control" id="author" th:field="*{author}" placeholder="Nhập tên tác giả hoặc tên hiển thị..." required oninvalid="this.setCustomValidity('Vui lòng nhập tên tác giả!')" oninput="this.setCustomValidity('')">
                                </div>

                                <!-- Tags -->
                                <div class="col-md-6">
                                    <label for="tagsInput" class="admin-form-label">Thẻ Tags </label>
                                    <input type="text" class="admin-form-control form-control" id="tagsInput" name="tags" placeholder="Yonex, Astrox, Hướng dẫn..." th:value="${blog.tags != null ? T(java.lang.String).join(', ', blog.tags) : ''}">
                                </div>

                                <!-- Image Cover -->
                                <div class="col-md-8">
                                    <label for="imageFile" class="admin-form-label">Hình ảnh bìa bài viết </label>
                                    <input type="file" class="admin-form-control form-control" id="imageFile" name="imageFile" accept="image/jpeg,image/png,image/webp" onchange="previewImage(event)">
                                    <div class="form-text">Định dạng chấp nhận: JPG, JPEG, PNG, WEBP. Dung lượng tối đa: 5MB.</div>
                                </div>
                                
                                <!-- Image Preview Area -->
                                <div class="col-md-4 text-center">
                                    <label class="admin-form-label d-block">Ảnh bìa bài viết</label>
                                    <div class="border rounded p-2 d-inline-block bg-light" style="width: 100%; max-width: 200px; height: 130px; line-height: 110px; overflow: hidden;">
                                        <img id="imgPreview" 
                                             th:src="${blog.image != null ? (#strings.startsWith(blog.image, '/uploads/') ? blog.image : '/images/blog/' + blog.image) : ''}" 
                                             alt="Ảnh bìa" 
                                             th:style="${blog.image != null ? 'max-width: 100%; max-height: 100%; object-fit: cover; display: inline-block;' : 'max-width: 100%; max-height: 100%; object-fit: cover; display: none;'}">
                                        <i id="imgPlaceholder" class="fas fa-image fa-3x text-muted" style="vertical-align: middle;" 
                                           th:style="${blog.image != null ? 'display: none;' : 'vertical-align: middle;'}"></i>
                                    </div>
                                </div>

                                <!-- Summary -->
                                <div class="col-12">
                                    <label for="summary" class="admin-form-label">Tóm tắt ngắn bài viết <span class="text-danger">*</span></label>
                                    <textarea class="admin-form-control form-control" id="summary" th:field="*{summary}" rows="3" placeholder="Nhập một đoạn tóm tắt ngắn..." required maxlength="500"></textarea>
                                    <div class="form-text text-end" id="summaryCounter">0/500 ký tự</div>
                                </div>

                                <!-- Content (CKEditor) -->
                                <div class="col-12">
                                    <label for="content" class="admin-form-label">Nội dung chi tiết bài viết <span class="text-danger">*</span></label>
                                    <textarea class="admin-form-control form-control" id="content" th:field="*{content}" placeholder="Viết nội dung bài viết ở đây..."></textarea>
                                </div>

                                <!-- Form Actions -->
                                <div class="col-12 border-top pt-3 d-flex justify-content-end gap-2 form-actions-bar">
                                    <button type="button" class="admin-btn admin-btn-secondary px-4" th:if="${isIframe}" onclick="window.parent.closeBlogFormModal()">
                                        <i class="fas fa-times me-1"></i>Hủy
                                    </button>
                                    <button type="reset" class="admin-btn admin-btn-secondary px-4" th:unless="${isIframe}">Nhập lại</button>
                                    <button type="submit" class="admin-btn admin-btn-primary px-4"><i class="fas fa-save me-1"></i>Lưu Thay Đổi</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        let editorInstance;
        ClassicEditor
            .create(document.querySelector('#content'), {
                toolbar: [
                    'heading', '|', 
                    'bold', 'italic', 'link', 'bulletedList', 'numberedList', 'blockQuote', '|',
                    'insertTable', 'mediaEmbed', 'codeBlock', '|',
                    'undo', 'redo'
                ],
                language: 'vi'
            })
            .then(editor => {
                editorInstance = editor;
            })
            .catch(error => {
                console.error('Error initializing CKEditor:', error);
                showToast('Không thể khởi tạo trình soạn thảo bài viết. Vui lòng tải lại trang.', 'error');
            });

        const summaryInput = document.getElementById('summary');
        const summaryCounter = document.getElementById('summaryCounter');
        let isComposing = false;
        
        function updateCounter() {
            if (!summaryInput || !summaryCounter) return;
            const count = summaryInput.value.length;
            summaryCounter.textContent = `${count}/500 ký tự`;
        }
        
        if (summaryInput) {
            summaryInput.addEventListener('compositionstart', () => { isComposing = true; });
            summaryInput.addEventListener('compositionend', () => { isComposing = false; updateCounter(); });
            summaryInput.addEventListener('input', () => { if (!isComposing) updateCounter(); });
            updateCounter();
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('imgPreview');
                const placeholder = document.getElementById('imgPlaceholder');
                if (preview) {
                    preview.src = reader.result;
                    preview.style.display = 'inline-block';
                }
                if (placeholder) placeholder.style.display = 'none';
            }
            if (event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        const editForm = document.getElementById('editBlogForm');
        if (editForm) {
            editForm.addEventListener('submit', function(event) {
                if (editorInstance) {
                    const editorData = editorInstance.getData();
                    document.querySelector('#content').value = editorData;
                    
                    if (editorData.trim() === '') {
                        showToast('Nội dung bài viết không được để trống!', 'warning');
                        event.preventDefault();
                        return false;
                    }
                }
                
                const title = document.getElementById('title').value.trim();
                const category = document.getElementById('category').value;
                const author = document.getElementById('author').value.trim();
                const summary = document.getElementById('summary').value.trim();

                if (title === '' || category === '' || author === '' || summary === '') {
                    showToast('Vui lòng điền đầy đủ các thông tin bắt buộc (*)', 'warning');
                    event.preventDefault();
                    return false;
                }

                const fileInput = document.getElementById('imageFile');
                if (fileInput.files[0] && fileInput.files[0].size > 5 * 1024 * 1024) {
                    showToast('Kích thước ảnh bìa không được vượt quá 5MB!', 'warning');
                    event.preventDefault();
                    return false;
                }
            });
        }
    </script>

    <!-- Modal Xem Trước Bài Viết (In-page Preview với Device Switcher) -->
    <div class="modal fade" id="blogPreviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered" style="max-width: 1180px; margin: 1.5rem auto;">
            <div class="modal-content admin-modal-content" style="border-radius: 16px; overflow: hidden; height: 88vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.25);">
                <div class="modal-header admin-modal-header py-2 px-3" style="flex-shrink: 0; background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between;">
                    <div class="d-flex align-items-center gap-2">
                        <span class="badge bg-warning text-dark px-2 py-1"><i class="fas fa-eye me-1"></i>Xem Trước</span>
                        <h6 class="modal-title mb-0 fw-bold text-dark text-truncate" style="max-width: 450px;" id="blogPreviewModalLabel">
                            Xem Trước Bài Viết
                        </h6>
                    </div>

                    <!-- Responsive Viewport Switcher & External Link -->
                    <div class="d-flex align-items-center gap-2">
                        <div class="btn-group btn-group-sm" role="group" aria-label="Device view">
                            <button type="button" class="btn btn-outline-secondary active" id="btnBlogViewDesktop" onclick="setBlogPreviewDevice('100%')" title="Xem dạng Máy tính">
                                <i class="fas fa-desktop me-1"></i> Desktop
                            </button>
                            <button type="button" class="btn btn-outline-secondary" id="btnBlogViewTablet" onclick="setBlogPreviewDevice('768px')" title="Xem dạng Máy tính bảng">
                                <i class="fas fa-tablet-alt me-1"></i> Tablet
                            </button>
                            <button type="button" class="btn btn-outline-secondary" id="btnBlogViewMobile" onclick="setBlogPreviewDevice('390px')" title="Xem dạng Điện thoại">
                                <i class="fas fa-mobile-alt me-1"></i> Mobile
                            </button>
                        </div>
                        <a id="btnOpenNewTabBlogPreview" href="#" target="_blank" class="btn btn-sm btn-outline-primary" title="Mở bài viết trong tab mới nếu muốn">
                            <i class="fas fa-external-link-alt me-1"></i> Tab mới
                        </a>
                        <button type="button" class="btn-close ms-2" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                </div>

                <div class="modal-body p-0" style="flex: 1; height: calc(100% - 55px); overflow: hidden; background-color: #f1f5f9; display: flex; justify-content: center; align-items: stretch;">
                    <div id="blogPreviewFrameContainer" style="width: 100%; height: 100%; transition: width 0.3s ease; background-color: #ffffff; box-shadow: 0 0 20px rgba(0,0,0,0.1);">
                        <iframe id="blogPreviewIframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let blogPreviewModal = null;

        document.addEventListener('DOMContentLoaded', function() {
            const blogPreviewModalEl = document.getElementById('blogPreviewModal');
            if (blogPreviewModalEl && typeof bootstrap !== 'undefined') {
                blogPreviewModal = new bootstrap.Modal(blogPreviewModalEl);
                blogPreviewModalEl.addEventListener('hidden.bs.modal', function () {
                    const iframe = document.getElementById('blogPreviewIframe');
                    if (iframe) iframe.src = '';
                });
            }

            window.openBlogPreviewModal = function(url, title) {
                const modalLabel = document.getElementById('blogPreviewModalLabel');
                const iframe = document.getElementById('blogPreviewIframe');
                const newTabBtn = document.getElementById('btnOpenNewTabBlogPreview');

                if (modalLabel) modalLabel.textContent = title || 'Xem Trước Bài Viết';
                if (iframe) iframe.src = url;
                if (newTabBtn) newTabBtn.href = url;

                setBlogPreviewDevice('100%');
                if (blogPreviewModal) {
                    blogPreviewModal.show();
                } else if (blogPreviewModalEl) {
                    const modal = new bootstrap.Modal(blogPreviewModalEl);
                    modal.show();
                }
            };

            window.setBlogPreviewDevice = function(width) {
                const container = document.getElementById('blogPreviewFrameContainer');
                const btnDesktop = document.getElementById('btnBlogViewDesktop');
                const btnTablet = document.getElementById('btnBlogViewTablet');
                const btnMobile = document.getElementById('btnBlogViewMobile');

                if (container) container.style.width = width;
                if (btnDesktop) btnDesktop.classList.remove('active');
                if (btnTablet) btnTablet.classList.remove('active');
                if (btnMobile) btnMobile.classList.remove('active');

                if (width === '100%' && btnDesktop) btnDesktop.classList.add('active');
                if (width === '768px' && btnTablet) btnTablet.classList.add('active');
                if (width === '390px' && btnMobile) btnMobile.classList.add('active');
            };
        });
    </script>

    <!-- Bootstrap 5.3.0 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Admin Layout JS -->
    <script th:src="@{/js/admin-layout.js(v='2.4')}"></script>
</body>
</html>
