<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Kết Quả Xác Nhận - SmashVN</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .result-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 90%;
            padding: 50px 30px;
            text-align: center;
            background: #ffffff;
            transition: transform 0.3s ease;
        }
        .result-card:hover {
            transform: translateY(-5px);
        }
        .icon-box {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .icon-success {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .icon-error {
            background-color: #f8d7da;
            color: #842029;
        }
        .btn-home {
            background-color: #212529;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-home:hover {
            background-color: #000000;
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }
        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="result-card">
    <div th:class="'icon-box ' + (${success} ? 'icon-success' : 'icon-error')">
        <i th:class="${success} ? 'fas fa-check' : 'fas fa-exclamation'"></i>
    </div>
    
    <h3 class="fw-bold mb-3 text-dark" th:text="${title}">Thao Tác Thành Công</h3>
    <p class="text-secondary mb-5 px-3" th:text="${message}">Mô tả chi tiết kết quả xử lý yêu cầu.</p>
    
    <a th:if="${isIframe == null or !isIframe}" href="/admin/all" class="btn btn-home shadow-sm">
        <i class="fas fa-arrow-left me-2"></i>Quay lại Dashboard
    </a>
    <button th:if="${isIframe}" onclick="triggerParentReload()" class="btn btn-home shadow-sm btn-success bg-success border-success text-white">
        <i class="fas fa-check me-2"></i>Đóng & Cập nhật
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript" th:if="${isIframe}">
    /*<![CDATA[*/
    function triggerParentReload() {
        var message = /*[[${message}]]*/ 'Thao tác thành công!';
        if (window.parent && window.parent.handleIframeSuccess) {
            window.parent.handleIframeSuccess(message);
        } else {
            window.parent.location.reload();
        }
    }
    
    // Auto trigger parent reload after 1.5 seconds
    setTimeout(function() {
        triggerParentReload();
    }, 1500);
    /*]]>*/
</script>
</body>
</html>
