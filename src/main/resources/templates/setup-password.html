<!DOCTYPE html>
<html class="no-js" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link th:href="@{/images/favicon.png}" rel="shortcut icon">
    <title>Thiết lập mật khẩu chính thức - Smash VN</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/vendor.css}">
    <link rel="stylesheet" th:href="@{/css/utility.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="config">
    <div class="preloader is-active">
        <div class="preloader__wrap">
            <img class="preloader__img" th:src="@{/images/preloader.svg}" alt="Đang tải" width="64" height="64">
        </div>
    </div>

    <div id="app">
        <header class="header--style-1">
            <div th:replace="~{layout/header :: header}"></div>
        </header>

        <div class="app-content">
            <div class="u-s-p-y-60">
                <div class="section__content">
                    <div class="container">
                        <div class="breadcrumb">
                            <div class="breadcrumb__wrap">
                                <ul class="breadcrumb__list">
                                    <li class="has-separator"><a th:href="@{/}">Trang chủ</a></li>
                                    <li class="is-marked"><a href="javascript:void(0)">Thiết lập mật khẩu chính thức</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="u-s-p-b-60">
                <div class="section__intro u-s-m-b-40">
                    <div class="container">
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="section__text-wrap">
                                    <h1 class="section__heading u-c-secondary">THIẾT LẬP MẬT KHẨU CHÍNH THỨC</h1>
                                    <span class="section__span" style="color:#475569;font-size:14px;">
                                        Bạn đang đăng nhập bằng mật khẩu tạm thời. Vui lòng tạo mật khẩu mới để kích hoạt tài khoản.
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section__content">
                    <div class="container">
                        <div class="row row--center">
                            <div class="col-lg-6 col-md-8 u-s-m-b-30">
                                <div class="l-f-o">
                                    <div class="l-f-o__pad-box" style="border:1px solid #e2e8f0;border-radius:12px;padding:30px;">
                                        <div th:if="${loi != null}" style="padding:12px;background:#fef2f2;border:1px solid #fee2e2;border-radius:8px;margin-bottom:20px;">
                                            <span style="color:#ef4444;font-weight:600;font-size:13px;" th:text="${loi}">Lỗi xảy ra</span>
                                        </div>

                                        <form class="l-f-o__form" th:action="@{/user/setup-password}" method="post" id="setup-password-form">
                                            <div class="u-s-m-b-25">
                                                <label class="gl-label" for="newPassword">MẬT KHẨU MỚI *</label>
                                                <div style="position:relative;display:flex;align-items:center;">
                                                    <input class="input-text input-text--primary-style" type="password" id="newPassword" name="newPassword" required autocomplete="new-password" placeholder="8–30 ký tự, gồm chữ và số" style="width:100%;border:2px solid #cbd5e1;padding-right:42px;border-radius:8px;">
                                                    <button type="button" class="toggle-password" data-target="newPassword" style="position:absolute;right:10px;background:none;border:none;cursor:pointer;color:#64748b;"><i class="fas fa-eye"></i></button>
                                                </div>
                                                <span id="new-password-error" style="color:#ef4444;font-size:12px;display:none;margin-top:5px;"></span>
                                            </div>

                                            <div class="u-s-m-b-30">
                                                <label class="gl-label" for="confirmPassword">XÁC NHẬN MẬT KHẨU MỚI *</label>
                                                <div style="position:relative;display:flex;align-items:center;">
                                                    <input class="input-text input-text--primary-style" type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" placeholder="Nhập lại mật khẩu mới" style="width:100%;border:2px solid #cbd5e1;padding-right:42px;border-radius:8px;">
                                                    <button type="button" class="toggle-password" data-target="confirmPassword" style="position:absolute;right:10px;background:none;border:none;cursor:pointer;color:#64748b;"><i class="fas fa-eye"></i></button>
                                                </div>
                                                <span id="confirm-password-error" style="color:#ef4444;font-size:12px;display:none;margin-top:5px;"></span>
                                            </div>

                                            <button class="btn btn--e-brand-b-2" type="submit" style="width:100%;padding:14px;font-weight:700;border-radius:8px;">
                                                KÍCH HOẠT TÀI KHOẢN
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer th:replace="~{layout/footer :: footer}"></footer>
        <div th:replace="~{layout/modals :: all-modals}"></div>
    </div>

    <script th:src="@{/js/vendor.js}"></script>
    <script th:src="@{/js/jquery.shopnav.js}"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        $(document).ready(function () {
            $('.toggle-password').on('mousedown touchstart', function (event) {
                event.preventDefault();
                $('#' + $(this).data('target')).attr('type', 'text');
                $(this).find('i').removeClass('fa-eye').addClass('fa-eye-slash');
            }).on('mouseup mouseleave touchend', function () {
                $('#' + $(this).data('target')).attr('type', 'password');
                $(this).find('i').removeClass('fa-eye-slash').addClass('fa-eye');
            });

            $('#setup-password-form').on('submit', function (event) {
                const password = $('#newPassword').val();
                const confirmation = $('#confirmPassword').val();
                const passwordValid = /^(?=.*[A-Za-z])(?=.*\d)\S{8,30}$/.test(password);
                $('#new-password-error').toggle(!passwordValid).text('Mật khẩu phải dài từ 8 đến 30 ký tự, không có khoảng trắng, gồm cả chữ và số.');
                const confirmationValid = password === confirmation;
                $('#confirm-password-error').toggle(!confirmationValid).text('Mật khẩu xác nhận không trùng khớp.');
                if (!passwordValid || !confirmationValid) event.preventDefault();
            });
        });
    </script>
</body>
</html>
