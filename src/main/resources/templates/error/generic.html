<!DOCTYPE html>
<html class="no-js" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link th:href="@{/images/favicon.png}" rel="shortcut icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Lỗi Hệ Thống - Smash VN</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,800" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/vendor.css}">
    <link rel="stylesheet" th:href="@{/css/utility.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="config">
    <div id="app">
        <!-- Header -->
        <header class="header--style-1">
            <div th:replace="~{layout/header :: header}"></div>
        </header>

        <div class="app-content">
            <div class="u-s-p-y-60">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="error-card" style="text-align: center; max-width: 600px; margin: 0 auto; padding: 40px; border: 1.5px dashed #ff4500; border-radius: 16px; background-color: #ffffff; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);">
                                <div style="width: 80px; height: 80px; border-radius: 50%; background-color: rgba(255, 69, 0, 0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
                                    <i class="fas fa-exclamation-triangle" style="color: #ff4500; font-size: 2.5rem;"></i>
                                </div>
                                <h1 style="font-size: 2rem; font-weight: 800; color: #15171c; margin-bottom: 16px;">Có Lỗi Xảy Ra!</h1>
                                <p style="color: #ff4500; font-size: 1.1rem; font-weight: 600; margin-bottom: 24px;" th:text="${loi != null ? loi : 'Đã xảy ra lỗi hệ thống. Vui lòng liên hệ với quản trị viên!'}">Đã xảy ra lỗi hệ thống.</p>
                                <p style="color: #707070; font-size: 0.9rem; line-height: 1.6; margin-bottom: 30px;">
                                    Hệ thống đã ghi lại lỗi này và đang xử lý. Chúng tôi xin lỗi vì sự bất tiện này.
                                </p>
                                <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                                    <a class="btn btn--e-brand-b-2" style="display: inline-block; padding: 12px 28px; border-radius: 30px; font-weight: 700; text-decoration: none;" th:href="@{/}">QUAY LẠI TRANG CHỦ</a>
                                    <a class="btn btn--e-secondary" style="display: inline-block; padding: 12px 28px; border-radius: 30px; font-weight: 700; text-decoration: none;" th:href="@{/shop}">CỬA HÀNG</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer--style-1">
            <div th:replace="~{layout/footer :: footer}"></div>
        </footer>
    </div>

    <!-- Vendor JS -->
    <script th:src="@{/js/vendor.js}"></script>
    <script th:src="@{/js/jquery.shopnav.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
